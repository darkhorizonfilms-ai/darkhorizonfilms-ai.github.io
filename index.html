<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK HORIZON • ZeroGPU Spaces Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#03060d;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#090d1a;border-bottom:1px solid #1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{color:#38bdf8;font-weight:900;font-size:15px}
.badge{background:rgba(16,185,129,.15);color:#34d399;border:1px solid #10b981;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:#070b14;border-bottom:1px solid #1e293b;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:#0f172a;color:#cbd5e1;border:1px solid #334155;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border-color:#38bdf8;box-shadow:0 2px 10px rgba(2,132,199,0.4)}
.frame-wrap{flex:1;position:relative;background:#050811}
iframe{width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<header>
  <span class="brand">DARK HORIZON • ZeroGPU</span>
  <span class="badge">🟢 12 أداة ZeroGPU مجانية</span>
</header>

<div class="tabs" id="tabBar"></div>

<div class="frame-wrap">
  <iframe id="spaceFrame" src="https://hf.space" allow="microphone;camera;clipboard-write;fullscreen"></iframe>
</div>

<script>
const SPACES = [
  { name: "⚡ FLUX.1 Schnell (صور)", url: "https://hf.space" },
  { name: "🎬 Wan 2.2 فيديو سريع", url: "https://hf.space" },
  { name: "🔊 LTX 2.3 فيديو + صوت", url: "https://hf.space" },
  { name: "🎵 MiniMax H3 سينمائي", url: "https://hf.space" },
  { name: "🎤 LongCat وجه متكلم", url: "https://hf.space" },
  { name: "🏢 TRELLIS.2 مجسمات 3D", url: "https://hf.space" },
  { name: "🎥 Qwen 2.1 زاوية وإضاءة", url: "https://hf.space" },
  { name: "🖼 Krea 2 تعديل صور", url: "https://hf.space" },
  { name: "🎭 BFS تبديل الوجوه", url: "https://hf.space" },
  { name: "✂️ BRIA إزالة الخلفية 3.0", url: "https://hf.space" },
  { name: "🎙 Voice Isolator عزل الصوت", url: "https://hf.space" },
  { name: "🎨 MiniMax H3 صور", url: "https://hf.space" }
];

const bar = document.getElementById('tabBar');
const frame = document.getElementById('spaceFrame');

SPACES.forEach((sp, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (idx === 0 ? ' active' : '');
  btn.textContent = sp.name;
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    frame.src = sp.url;
  };
  bar.appendChild(btn);
});
</script>
</body>
</html>
