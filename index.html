<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DARK HORIZON v86</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#020617;color:#f8fafc;display:flex;flex-direction:column;height:100dvh;overflow:hidden}header{background:#0f172a;border-bottom:1px solid #1e293b;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}.brand{font-weight:800;font-size:13px;color:#38bdf8}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#064e3b;color:#34d399}.hbtns{display:flex;gap:5px}.hbtn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:5px 9px;border-radius:8px;font-size:11px;cursor:pointer}.toolbar{background:#090d16;border-bottom:1px solid #1e293b;padding:6px 10px;display:flex;gap:6px;overflow-x:auto}.chip{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:5px 10px;border-radius:99px;font-size:11px;white-space:nowrap;cursor:pointer}.chip.act{background:#0284c7;color:#fff}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;word-wrap:break-word}.usr{align-self:flex-start;background:#0284c7;color:#fff}.bot{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;color:#f1f5f9}.pic{width:100%;max-width:420px;border-radius:10px;margin-top:8px;display:block}.bar{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.abtn{background:#1e293b;color:#38bdf8;border:1px solid #334155;padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer}footer{background:#0f172a;border-top:1px solid #1e293b;padding:8px 10px;display:flex;gap:6px;align-items:center}#inp{flex:1;background:#020617;color:#fff;border:1px solid #334155;border-radius:99px;padding:10px 14px;font-size:13px;outline:none}.ibtn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px}#send{background:#0284c7;color:#fff;border:none}#modal{position:fixed;inset:0;background:rgba(2,6,23,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.mbox{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:16px;width:100%;max-width:400px}.mbox input{width:100%;padding:8px;margin:4px 0 10px;border-radius:8px;border:1px solid #334155;background:#020617;color:#fff;font-size:12px}</style></head><body><header><div class="brand">DARK HORIZON INFINITE v86</div><div class="badge" id="badge">🟢 المحركات الـ 4 + Kaggle</div><div class="hbtns"><button type="button" class="hbtn" id="btnOn" style="background:#065f46;color:#34d399">▶️ تفعيل</button><button type="button" class="hbtn" id="btnOff" style="background:#7f1d1d;color:#fca5a5">⏹️ إيقاف</button><button type="button" class="hbtn" id="btnSet">⚙️</button><button type="button" class="hbtn" id="btnNew">+ جديد</button></div></header><div class="toolbar"><button type="button" class="chip act" data-m="auto">🧠 تلقائي</button><button type="button" class="chip" data-m="img">📸 صورة 1024px</button><button type="button" class="chip" data-m="vid">🎬 فيديو Kaggle</button><button type="button" class="chip" data-m="anime">⛩️ أنمي</button><button type="button" class="chip" data-m="3d">🧊 3D</button><select class="chip" id="mdlSel"><option value="AUTO">⚡ تلقائي (الأقوى: FLUX.1-dev + schnell + ICBINP)</option><option value="FLUX_DEV">🔥 FLUX.1-dev (الأقوى دقة وواقعية 1024px)</option><option value="FLUX_SCHNELL">⚡ FLUX.1-schnell (فائق السرعة 1024px)</option><option value="ICBINP">📸 ICBINP - I Can't Believe It's Not Photography</option></select></div><div id="chat"><div class="msg bot">👑 <b>تم إصلاح الواجهة بالكامل (v86)!</b> اكتب فكرتك واضغط إرسال.</div></div><footer><button type="button" class="ibtn" id="btnIdea">✨</button><button type="button" class="ibtn" id="mic">🎤</button><input id="inp" placeholder="اكتب فكرتك هنا..."><button type="button" class="ibtn" id="send">➤</button></footer><div id="modal"><div class="mbox"><h4 style="margin-bottom:10px;color:#38bdf8">⚙️ إعدادات خادم Kaggle T4</h4><input id="inGpu" placeholder="رابط Kaggle trycloudflare"><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="abtn" id="closeCfg">إغلاق</button><button type="button" class="abtn" id="saveCfg" style="background:#0284c7;color:#fff">💾 حفظ</button></div></div></div></div><script>
const S=String.fromCharCode(47),CF="https:"+S+S+"hidden-bread-95eb.dz30007000.workers.dev";let MODE="auto",CFG=JSON.parse(localStorage.getItem("dh_cfg_v86")||'{"gpu":"","gem":"","tog":""}');const chat=document.getElementById("chat"),inp=document.getElementById("inp"),badge=document.getElementById("badge");
function add(h,c="bot"){const d=document.createElement("div");d.className="msg "+c;d.innerHTML=h;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
document.querySelectorAll(".chip[data-m]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip[data-m]").forEach(x=>x.classList.remove("act"));b.classList.add("act");MODE=b.dataset.m;});

document.getElementById("btnIdea").onclick=()=>{const a=["صورة واقعية فائقة الدقة لمحارب عربي في الصحراء وقت الغروب","فيديو معركة ملحمية في شوارع طوكيو ليلاً تحت المطر مدته 10 ثوان","صورة سينمائية لسيارة رياضية خارقة على طريق جبلي ساحلي","فيديو قتال فنون قتالية سريع داخل معبد قديم مدته 10 ثوان"];inp.value=a[Math.floor(Math.random()*a.length)];inp.focus();};
document.getElementById("btnOn").onclick=async()=>{await syncGpu();if(CFG.gpu)add("✅ الخادم متصل: "+CFG.gpu);else window.open("https:"+S+S+"://kaggle.com"+S+"code","_blank");};
document.getElementById("btnOff").onclick=async()=>{if(CFG.gpu){try{await fetch(CFG.gpu+"/shutdown",{method:"POST"});}catch(e){}CFG.gpu="";localStorage.setItem("dh_cfg_v86",JSON.stringify(CFG));badge.textContent="🟡 متوقف";add("✅ تم الإيقاف.");}};
async function syncGpu(){for(const u of ["./gpu.json?t="+Date.now(),CF+"/get-gpu?t="+Date.now()]){try{const d=await(await fetch(u)).json();if(d&&d.gpu&&d.gpu.startsWith("https://")){CFG.gpu=d.gpu.replace(/\/$/,"");localStorage.setItem("dh_cfg_v86",JSON.stringify(CFG));badge.textContent="🟢 Kaggle + 4 محركات";return;}}catch(e){}}}syncGpu();
function speakVoice(t,f=false){try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0600-\u06FF]/.test(t)?"ar-SA":"en-US";u.pitch=f?1.18:0.86;window.speechSynthesis.speak(u);}catch(e){}}
async function forceDl(u,n){try{const b=await(await fetch(u)).blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();}catch(e){window.open(u,"_blank");}}
async function analyzePrompt(q){let secs=8,mMin=q.match(/(\d+)\s*(?:دقيق|دقائق|min)/i),mSec=q.match(/(\d+)\s*(?:ثان|ثوان|sec)/i);if(mMin)secs=parseInt(mMin)*60;else if(mSec)secs=parseInt(mSec);const clips=Math.min(6,Math.max(1,Math.ceil(secs/5)));try{const r=await fetch("https:"+S+S+"text.pollinations.ai"+S+"openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai-large",messages:[{role:"system",content:`أرجع JSON فقط: {"intent":"video|image|anime|3d|chat","reply":"وصف بالعربية","dialogue":"حوار بالعربية","scenes":["detailed English visual prompt"]}`},{role:"user",content:q}]})});const d=await r.json(),txt=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content,m=txt&&txt.match(/\{[\s\S]*\}/);if(m){const o=JSON.parse(m[0]);o.secs=secs;if(!o.scenes||!o.scenes.length)o.scenes=[q];while(o.scenes.length<clips)o.scenes.push(o.scenes[0]+", shot "+o.scenes.length);return o;}}catch(e){}let en=q;if(/[\u0600-\u06FF]/.test(en)){try{const tr=await(await fetch("https:"+S+S+"api.mymemory.translated.net"+S+"get?q="+encodeURIComponent(en)+"&langpair=ar|en")).json();if(tr&&tr.responseData)en=tr.responseData.translatedText;}catch(e){}}return {intent:/فيديو|فيلم|سباق|قتال|video/i.test(q)?"video":(/صورة|صور|ارسم|صمم|image/i.test(q)?"image":"chat"),reply:"",dialogue:"",scenes:Array.from({length:clips},(_,i)=>en+", shot "+(i+1)),secs};}
async function genImage(en,kind,box,hdr){const sel=document.getElementById("mdlSel").value,fullP=en+(kind==="anime"?", masterpiece anime film still, Ufotable style, 8k":kind==="3d"?", Unreal Engine 5 3D render, raytracing, 8k":", raw candid photography, shot on ARRI Alexa 65, 85mm f1.4, sharp focus, ultra-detailed skin texture, photorealistic 8k uhd");const spaces=[];if(sel==="FLUX_DEV"||sel==="AUTO")spaces.push({name:"FLUX.1-dev (1024px • الأقوى)",host:"black-forest-labs-flux-1-dev.hf.space",ep:"infer",data:[fullP,0,true,1024,1024,3.5,24]});if(sel==="FLUX_SCHNELL"||sel==="AUTO")spaces.push({name:"FLUX.1-schnell (1024px)",host:"black-forest-labs-flux-1-schnell.hf.space",ep:"infer",data:[fullP,0,true,1024,1024,4]});for(const sp of spaces){for(const pfx of ["/gradio_api/call/","/call/"]){try{box.innerHTML=hdr+`<br>🔥 جاري التصيير الفائق عبر <b>${sp.name}</b>...`;const base="https:"+S+S+sp.host+pfx+sp.ep,r=await fetch(base,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:sp.data})});if(!r.ok)continue;const {event_id}=await r.json();if(!event_id)continue;const sse=await(await fetch(base+S+event_id)).text(),m=sse.match(/"url":\s*"([^"]+\.(?:webp|png|jpg)[^"]*)"/)||sse.match(/"url":\s*"([^"]+)"/);if(m&&m)return {u:m,mdl:sp.name};}catch(e){}}}const hMdl="ICBINP - I Can't Believe It's Not Photography";try{box.innerHTML=hdr+`<br>📸 جاري التصيير الفوتوغرافي عبر <b>${hMdl}</b>...`;const hr=await fetch("https:"+S+S+"stablehorde.net"+S+"api"+S+"v2"+S+"generate"+S+"async",{method:"POST",headers:{"Content-Type":"application/json","apikey":"0000000000"},body:JSON.stringify({prompt:fullP+" ### watermark, blurry, deformed",params:{width:512,height:512,steps:24,sampler_name:"k_euler_a"},models:[hMdl]})}),{id}=await hr.json();if(id){for(let i=0;i<35;i++){await new Promise(r=>setTimeout(r,2000));const st=await(await fetch("https:"+S+S+"stablehorde.net"+S+"api"+S+"v2"+S+"generate"+S+"status"+S+id)).json();if(st.done&&st.generations&&st.generations)return {u:st.generations.img,mdl:hMdl};}}}catch(e){}return {u:"https:"+S+S+"image.pollinations.ai"+S+"prompt"+S+encodeURIComponent(fullP)+"?width=1024&height=1024&nologo=true",mdl:"FLUX.1-dev Fallback (1024px)"};}
async function genKaggleVideo(scenes,secs,dlg,box,hdr){if(!CFG.gpu){box.innerHTML=hdr+"<br>⚠️ خادم Kaggle غير متصل. اضغط <b>▶️ تفعيل</b>.";return;}const clips=[],perSec=Math.max(4,Math.round(secs/scenes.length));for(let idx=0;idx<scenes.length;idx++){try{const frames=Math.min(121,Math.max(65,perSec*16)),seed=Math.floor(Math.random()*9999999),wf={"1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"ltx-video-2b.safetensors"}},"2":{"class_type":"CLIPLoader","inputs":{"clip_name":"t5xxl_fp8_e4m3fn.safetensors","type":"ltxv"}},"3":{"class_type":"CLIPTextEncode","inputs":{"text":"high-speed dynamic action choreography, fluid motion, tracking camera, 8k cinema, "+scenes[idx],"clip":["2",0]}},"4":{"class_type":"CLIPTextEncode","inputs":{"text":"static, frozen, blurry, watermark","clip":["2",0]}},"5":{"class_type":"LTXVConditioning","inputs":{"positive":["3",0],"negative":["4",0],"frame_rate":24}},"6":{"class_type":"EmptyLTXVLatentVideo","inputs":{"width":704,"height":480,"length":frames,"batch_size":1}},"7":{"class_type":"LTXVScheduler","inputs":{"steps":20,"max_shift":2.05,"base_shift":0.95,"stretch":true,"terminal":0.1,"latent":["6",0]}},"8":{"class_type":"KSamplerSelect","inputs":{"sampler_name":"euler"}},"9":{"class_type":"RandomNoise","inputs":{"noise_seed":seed}},"10":{"class_type":"CFGGuider","inputs":{"cfg":4.0,"model":["1",0],"positive":["5",0],"negative":["5",1]}},"11":{"class_type":"SamplerCustomAdvanced","inputs":{"noise":["9",0],"guider":["10",0],"sampler":["8",0],"sigmas":["7",0],"latent_image":["6",0]}},"12":{"class_type":"VAEDecode","inputs":{"samples":["11",0],"vae":["1",2]}},"13":{"class_type":"SaveAnimatedWEBP","inputs":{"filename_prefix":"DH_Clip","fps":24,"lossless":false,"quality":85,"method":"default","images":["12",0]}}};const pr=await fetch(CFG.gpu+"/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:wf})});if(!pr.ok)throw new Error("رد الخادم "+pr.status);const {prompt_id}=await pr.json();let doneU="";for(let i=0;i<240;i++){box.innerHTML=hdr+`<br>🎬 <b>تصيير المقطع (${idx+1}/${scenes.length}) على Kaggle T4</b> (${i*2}ث)...`;await new Promise(r=>setTimeout(r,2000));const hr=await(await fetch(CFG.gpu+"/history/"+prompt_id)).json();if(hr[prompt_id]){const f=hr[prompt_id].outputs["13"].images[0];doneU=CFG.gpu+"/view?filename="+encodeURIComponent(f.filename)+"&subfolder="+encodeURIComponent(f.subfolder)+"&type="+f.type;break;}}if(!doneU)throw new Error("انتهت المهلة");clips.push(doneU);}catch(e){box.innerHTML=hdr+"<br>⚠️ خطأ Kaggle: "+e.message;return;}}const vBar=dlg?`<div style="margin-top:8px;padding:7px;background:#020617;border:1px solid #334155;border-radius:8px;font-size:12px;color:#fcd34d">🎙️ "${dlg}" <button type="button" class="abtn" onclick="speakVoice('${dlg.replace(/'/g,"")}',false)">🔊 رجل</button> <button type="button" class="abtn" onclick="speakVoice('${dlg.replace(/'/g,"")}',true)">🔊 امرأة</button></div>`:"";const htmlClips=clips.map((u,i)=>`<div style="margin-top:8px"><img src="${u}" class="pic"><div class="bar"><button type="button" class="abtn" onclick="forceDl('${u}','DarkHorizon_${i+1}.webp')">⬇️ حفظ ${i+1}</button></div></div>`).join("");box.innerHTML=`${hdr}<div style="color:#34d399;font-size:12px;margin-top:6px">✅ تم إنتاج الفيديو (${secs}ث)</div>${vBar}${htmlClips}`;if(dlg)speakVoice(dlg,/امرأة|فتاة|بنت|أميرة|سيدة/i.test(dlg));}
async function send(){const q=inp.value.trim();if(!q)return;inp.value="";add(q,"usr");const b=add("🧠 جاري التحليل..."),plan=await analyzePrompt(q),hdr=plan.reply?`<div style="margin-bottom:6px;color:#cbd5e1">${plan.reply}</div>`:"",m=(MODE==="auto")?plan.intent:MODE;if(m==="vid"||m==="video"){await genKaggleVideo(plan.scenes,plan.secs,plan.dialogue,b,hdr);return;}if(m==="img"||m==="image"||m==="anime"||m==="3d"){const res=await genImage(plan.scenes[0],m,b,hdr);b.innerHTML=`${hdr}<div style="color:#38bdf8;font-size:11px">✨ ${res.mdl}</div><img src="${res.u}" class="pic"><div class="bar"><button type="button" class="abtn" onclick="forceDl('${res.u}','DarkHorizon.png')">⬇️ حفظ</button><button type="button" class="abtn" id="toV">🎬 تحويل لفيديو (${plan.secs}ث)</button></div>`;b.querySelector("#toV").onclick=()=>genKaggleVideo(plan.scenes,plan.secs,plan.dialogue,b,hdr);return;}b.innerHTML=plan.reply||"تم.";}
document.getElementById("send").onclick=send;inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang="ar-SA";document.getElementById("mic").onclick=()=>{try{rec.start();add("🎙️ تحدث...");}catch(e){}};rec.onresult=e=>{inp.value=e.results[0][0].transcript;send();};}
