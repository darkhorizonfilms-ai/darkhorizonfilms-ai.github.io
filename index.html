        const wf={"1":{"class_type":"UNETLoader","inputs":{"unet_name":"wan2.1_t2v_14B_fp8_e4m3fn.safetensors","weight_dtype":"fp8_e4m3fn"}},"2":{"class_type":"CLIPLoader","inputs":{"clip_name":"umt5_xxl_fp8_e4m3fn_scaled.safetensors","type":"wan"}},"3":{"class_type":"VAELoader","inputs":{"vae_name":"wan_2.1_vae.safetensors"}},"4":{"class_type":"CLIPTextEncode","inputs":{"text":fullPrompt,"clip":["2",0]}},"5":{"class_type":"CLIPTextEncode","inputs":{"text":"static, frozen, motionless, deformed limbs, distorted face, blurry, lowres, watermark","clip":["2",0]}},"6":{"class_type":"EmptyHunyuanLatentVideo","inputs":{"width":832,"height":480,"length":81,"batch_size":1}},"7":{"class_type":"ModelSamplingSD3","inputs":{"shift":8.0,"model":["1",0]}},"8":{"class_type":"KSampler","inputs":{"seed":Math.floor(Math.random()*9999999),"steps":20,"cfg":6.0,"sampler_name":"uni_pc","scheduler":"simple","denoise":1,"model":["7",0],"positive":["4",0],"negative":["5",0],"latent_image":["6",0]}},"9":{"class_type":"VAEDecode","inputs":{"samples":["8",0],"vae":["3",0]}},"10":{"class_type":"SaveAnimatedWEBP","inputs":{"filename_prefix":"DH_Wan21","fps":16,"lossless":false,"quality":90,"method":"default","images":["9",0]}}};
        const pr=await fetch(CFG.gpu+"/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:wf})});
        if(pr.ok){

            if(hr[prompt_id]){
              const f=hr[prompt_id].outputs["10"].images.at(0);

              break;
            }
          }
        }
      }catch(e){}
    }

    // 2. واجهة SiliconFlow المجانية (Wan 2.1 14B) بدون ضغط
    if(CFG.sf&&!gotUrl){
      try{
        box.innerHTML=hdr+`<br>⚡ <b>تصيير المقطع (${c+1}/${clipCount}) عبر Wan 2.1-T2V-14B (SiliconFlow)...</b>`;

        if(sr.ok){
          const {requestId}=await sr.json();
          for(let i=0;i<60;i++){

            const m=sse.match(/"url":\s*"(https:[^"]+\.mp4[^"]*)"/);
            if(m&&m.at(1)){gotUrl=m.at(1);usedEng=sp.name;break;}
          }catch(e){}
        }
      }
    }

    if(gotUrl)mp4Clips.push({u:gotUrl,eng:usedEng});

  if(!mp4Clips.length){
    box.innerHTML=hdr+"<br>⚠️ <b>لتجنب الضغط العالمي والحصول على توليد فوري:</b><br>1. ضع مفتاح <b>Hugging Face المجاني (hf_...)</b> أو <b>SiliconFlow</b> في <b>⚙️ الإعدادات</b>.<br>2. أو فعّل خادمك الخاص في <b>Kaggle / Lightning AI</b> واضغط <b>▶️ تفعيل</b>.";

  const vBar=dlg?`<div style="margin-top:8px;padding:7px;background:#020617;border:1px solid #334155;border-radius:8px;font-size:12px;color:#fcd34d">🎙️ <b>حوار الفيلم:</b> "${dlg}" <button type="button" class="abtn" onclick="speakVoice('${dlg.replace(/'/g,"")}',false)">🔊 رجل</button> <button type="button" class="abtn" onclick="speakVoice('${dlg.replace(/'/g,"")}',true)">🔊 امرأة</button></div>`:"";
  const videosHtml=mp4Clips.map((item,idx)=>{

    return `<div style="margin-top:8px;background:#020617;border:1px solid #1e293b;border-radius:10px;padding:8px"><div style="color:#38bdf8;font-size:11px;margin-bottom:4px">🎞️ الجزء ${idx+1}/${mp4Clips.length} (${item.eng})</div>${mediaTag}<div class="bar"><button type="button" class="abtn" onclick="forceDl('${item.u}','DarkHorizon_Part${idx+1}.${isWebp?"webp":"mp4"}')">⬇️ حفظ الجزء ${idx+1}</button></div></div>`;
  }).join("");

  box.innerHTML=`${hdr}<div style="color:#34d399;font-size:12px;margin-top:6px">🎬 <b>تم إنتاج الفيديو بالقالب العالمي (${targetSecs} ثانية)</b></div>${vBar}${videosHtml}`;
  if(dlg)speakVoice(dlg,/امرأة|فتاة|بنت|أميرة|سيدة/i.test(dlg));
}
