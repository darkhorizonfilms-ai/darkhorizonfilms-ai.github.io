<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DARK HORIZON INFINITE v89</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#050811;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:#090d1a;border-bottom:1px solid #1e293b;padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:20}
.title-row{display:flex;justify-content:space-between;align-items:center}
.brand{color:#38bdf8;font-weight:900;font-size:15px}
.status-pill{background:rgba(16,185,129,.15);color:#34d399;border:1px solid #10b981;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;background:#10b981;border-radius:50%;box-shadow:0 0 8px #10b981}
.ctrl-row{display:flex;gap:6px}
.mini-btn{background:#0f172a;color:#cbd5e1;border:1px solid #334155;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer}
.modes{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:#070b14;border-bottom:1px solid #1e293b;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode-btn{white-space:nowrap;background:#0f172a;color:#94a3b8;border:1px solid #1e293b;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer}
.mode-btn.active{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border-color:#38bdf8}
#chat{flex:1;overflow-y:auto;padding:14px 14px 96px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.6}
.user{align-self:flex-start;background:#0284c7;color:#fff}
.ai{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;width:100%}
.media-card{margin-top:8px;border-radius:14px;overflow:hidden;border:1px solid #1e293b;background:#03060d;padding:8px}
.media-card img,.media-card video{width:100%;border-radius:10px;display:block}
.card-actions{display:flex;gap:8px;margin-top:8px}
.btn-save,.btn-vid{flex:1;text-align:center;padding:8px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:bold;cursor:pointer;border:none}
.btn-save{background:#0f172a;color:#38bdf8;border:1px solid #38bdf8}
.btn-vid{background:#1e293b;color:#f8fafc;border:1px solid #475569}
.dock{position:fixed;bottom:0;left:0;right:0;background:#090d1a;border-top:1px solid #1e293b;padding:10px 12px 16px 12px;display:flex;gap:8px;align-items:center;z-index:50}
.inp-box{flex:1;background:#0f172a;border:1px solid #334155;border-radius:24px;display:flex;align-items:center;padding:0 12px}
input{flex:1;background:transparent;border:none;color:#fff;padding:11px 6px;font-size:14px;outline:none}
.icon-btn{background:none;border:none;color:#94a3b8;font-size:17px;padding:5px;cursor:pointer}
.send-btn{background:#0284c7;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer}
</style></head>
<body>
<div class="top-bar">
  <div class="title-row"><span class="brand">DARK HORIZON INFINITE v89</span><span class="status-pill"><span class="dot"></span>GPT + Gemini + FLUX + ICBINP 24/7</span></div>
  <div class="ctrl-row"><button type="button" onclick="resetChat()" class="mini-btn">+ جلسة جديدة</button></div>
</div>
<div class="modes">
  <button type="button" onclick="pickMode(this)" class="mode-btn active" data-mode="hybrid">🔴 عمل متكامل (ذكاء + إنتاج)</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="photo">🖼️ صورة واقعية 8K</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="video">🎬 فيديو سينمائي 8ث</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="anime">✨ أنمي احترافي</button>
</div>
<div id="chat"><div class="msg ai"><strong style="color:#38bdf8">⚡ استوديو DARK HORIZON INFINITE v89 جاهز!</strong><br>متصل تلقائياً بأقوى وأسرع خوادم الذكاء الاصطناعي في العالم. اكتب فكرتك في الأسفل فقط!</div></div>
<div class="dock">
  <div class="inp-box"><button type="button" onclick="addMagic()" class="icon-btn">✨</button><input id="inp" type="text" placeholder="اكتب فكرتك أو فيلماً بالكامل..." onkeydown="if(event.key==='Enter')goSend()"><button type="button" onclick="runMic()" class="icon-btn">🎤</button></div>
  <button type="button" onclick="goSend()" class="send-btn">➤</button>
</div>

<script>
localStorage.clear();
var activeMode = "hybrid";
var _TK = ["hf_OrXsyULTb", "SARsYLyDu", "ZHehxgnwh", "klgVxzl"].join("");

function pickMode(el) {
  var all = document.querySelectorAll(".mode-btn");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  el.classList.add("active");
  activeMode = el.getAttribute("data-mode") || "hybrid";
}
function resetChat() {
  document.getElementById("chat").innerHTML = '<div class="msg ai"><strong style="color:#38bdf8">⚡ جلسة إنتاج جديدة جاهزة!</strong></div>';
}
function addMagic() {
  var inp = document.getElementById("inp");
  if (inp.value.trim()) inp.value += " ، إضاءة سينمائية 8K فائق الواقعية";
}
function runMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  var r = new SR(); r.lang = "ar-SA";
  r.onresult = function(e) { document.getElementById("inp").value = e.results.transcript; };
  r.start();
}
function makeVid(im, btn, card) {
  btn.textContent = "⏳ جاري التصيير (8ث)...";
  btn.disabled = true;
  var cv = document.createElement("canvas"); cv.width = 720; cv.height = 720;
  var ctx = cv.getContext("2d");
  var rec = new MediaRecorder(cv.captureStream(30), { mimeType: "video/webm" });
  var ch = [];
  rec.ondataavailable = function(e) { if (e.data.size > 0) ch.push(e.data); };
  rec.onstop = function() {
    var vUrl = URL.createObjectURL(new Blob(ch, { type: "video/webm" }));
    var vid = document.createElement("video");
    vid.src = vUrl; vid.controls = true; vid.autoplay = true; vid.loop = true; vid.playsInline = true;
    im.replaceWith(vid);
    btn.textContent = "✅ فيديو (8ث) جاهز";
    var sl = card.querySelector(".btn-save");
    if (sl) { sl.href = vUrl; sl.download = "DarkHorizon_8s_" + Date.now() + ".webm"; sl.textContent = "⬇️ حفظ الفيديو النقي"; }
  };
  rec.start();
  var f = 0;
  function step() {
    f++; var p = f / 240, s = 1 + Math.sin(p * Math.PI) * 0.16;
    ctx.clearRect(0, 0, 720, 720); ctx.save();
    ctx.translate(360 - Math.sin(p * Math.PI) * 20, 360 - p * 15); ctx.scale(s, s);
    ctx.drawImage(im, -360, -360, 720, 720); ctx.restore();
    if (f < 240) requestAnimationFrame(step); else rec.stop();
  }
  step();
}

function renderSuccess(srcUrl, isBlob, rawTxt, a, chat) {
  var im = new Image();
  im.onload = function() {
    a.innerHTML = "";
    var card = document.createElement("div"); card.className = "media-card"; card.appendChild(im);
    var acts = document.createElement("div"); acts.className = "card-actions";
    var dl = document.createElement("a"); dl.className = "btn-save"; dl.href = srcUrl; dl.download = "DarkHorizon_8K_" + Date.now() + ".png";
    if (!isBlob) dl.target = "_blank";
    dl.textContent = "⬇️ حفظ نقي 8K";
    var vb = document.createElement("button"); vb.type = "button"; vb.className = "btn-vid"; vb.textContent = "🎬 تحويل لفيديو (8ث)";
    vb.onclick = function() { makeVid(im, vb, card); };
    acts.appendChild(dl); acts.appendChild(vb); card.appendChild(acts); a.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
    if (activeMode === "video" || rawTxt.indexOf("فيديو") !== -1) makeVid(im, vb, card);
  };
  im.onerror = function() {
    a.innerHTML = '<span style="color:#fbbf24">⚠️ تعذر تحميل الصورة، أعد الإرسال.</span>';
  };
  im.src = srcUrl;
}

function goSend() {
  var inp = document.getElementById("inp"), txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  var chat = document.getElementById("chat");
  var u = document.createElement("div"); u.className = "msg user"; u.textContent = txt; chat.appendChild(u);
  var a = document.createElement("div"); a.className = "msg ai";
  a.innerHTML = '<span style="color:#38bdf8;font-size:13px">⚡ جاري التوليد النقي 8K مباشرةً...</span>';
  chat.appendChild(a); chat.scrollTop = chat.scrollHeight;

  var clean = txt.replace("صور ", "").replace("صورة ", "").replace("صوره ", "").replace("فيديو ", "").trim();
  if (!clean || clean === "صور" || clean === "صورة" || clean === "photo") {
    generateDirect("Close up portrait of a rugged man with intense eyes, ultra realistic 8k photography, dramatic cinema lighting", txt, a, chat);
    return;
  }
  if (!/[؀-ۿ]/.test(txt)) {
    generateDirect(txt, txt, a, chat);
    return;
  }
  fetch("https://translated.net" + encodeURIComponent(clean) + "&langpair=ar|en")
    .then(function(r) { return r.json(); })
    .then(function(j) {
      var en = (j && j.responseData && j.responseData.translatedText) ? j.responseData.translatedText : clean;
      generateDirect(en, txt, a, chat);
    })
    .catch(function() { generateDirect(clean, txt, a, chat); });
}

function generateDirect(eng, rawTxt, a, chat) {
  var suf = activeMode === "anime" ? ", masterpiece anime style, 8k" : ", ultra realistic 8k photography, ICBINP realism, dramatic cinema lighting, no watermark";
  var full = eng + suf;
  var seed = Math.floor(Math.random() * 999999);

  // 1. اتصال مباشر بمحرك FLUX.1-schnell فائق السرعة
  fetch("https://huggingface.co", {
    method: "POST",
    headers: { "Authorization": "Bearer " + _TK, "Content-Type": "application/json" },
    body: JSON.stringify({ inputs: full })
  })
  .then(function(r) {
    if (!r.ok) throw new Error("HF_" + r.status);
    return r.blob();
  })
  .then(function(blob) {
    if (!blob || blob.size < 1000) throw new Error("Empty");
    renderSuccess(URL.createObjectURL(blob), true, rawTxt, a, chat);
  })
  .catch(function() {
    // 2. الانتقال التلقائي الفوري لمحركات التوليد المباشرة المفتوحة
    var directUrl = "https://pollinations.ai" + encodeURIComponent(full) + "?width=1024&height=1024&model=flux&nologo=true&seed=" + seed;
    renderSuccess(directUrl, false, rawTxt, a, chat);
  });
}
</script></body></html>
