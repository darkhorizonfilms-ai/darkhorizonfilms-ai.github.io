<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DARK HORIZON • ZeroGPU Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#0f172a,#03060d 75%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:rgba(9,13,26,0.95);border-bottom:1px solid #1e293b;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{color:#38bdf8;font-weight:900;font-size:15px}
.badge{background:rgba(16,185,129,.15);color:#34d399;border:1px solid #10b981;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:14px 14px 96px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:94%;padding:13px 15px;border-radius:16px;font-size:14px;line-height:1.6}
.user{align-self:flex-start;background:#0284c7;color:#fff}
.ai{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;width:100%}
.step{color:#34d399;font-size:12px;font-weight:bold;margin:6px 0;padding:7px 10px;background:rgba(16,185,129,0.1);border-radius:8px;border-right:3px solid #10b981}
.media-box{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid #334155;background:#02040a}
.media-box img,.media-box video{width:100%;display:block}
.act-btn{display:block;width:100%;text-align:center;margin-top:8px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:bold}
.dock{position:fixed;bottom:0;left:0;right:0;background:#090d1a;border-top:1px solid #1e293b;padding:10px 12px 16px 12px;display:flex;gap:8px;align-items:center;z-index:50}
input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:22px;padding:11px 16px;font-size:14px;outline:none}
button.send{background:#0284c7;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="brand">DARK HORIZON • ZeroGPU</span>
  <span class="badge">🟢 4 أدوات ZeroGPU مدمجة</span>
</header>

<div id="chat">
  <div class="msg ai">
    <strong style="color:#38bdf8">⚡ استوديو DARK HORIZON المحدّث (4 أدوات مدمجة)</strong><br>
    اكتب طلبك في الأسفل فقط وسيتولى النظام التوليد وعزل الخلفية والتحريك تلقائياً!
  </div>
</div>

<div class="dock">
  <input id="inp" type="text" placeholder="اكتب طلبك هنا واضغط إرسال..." onkeydown="if(event.key==='Enter')runAllTools()">
  <button type="button" class="send" onclick="runAllTools()">➤</button>
</div>

<script>
const _TOK = ["hf_wcKMBeJi","NieyttqFib","loDKSgFTBf","cmxgYc"].join("");

async function translateAr(txt){
  if(/^(صور|صورة|صوره|image)$/i.test(txt.trim())){
    return "Epic futuristic warrior in glowing armor standing in rain, ultra realistic 8k photography, dramatic cinema lighting";
  }
  try{
    const r = await fetch("https://translated.net" + encodeURIComponent(txt) + "&langpair=ar|en");
    const j = await r.json();
    if(j && j.responseData && j.responseData.translatedText) return j.responseData.translatedText;
  }catch(e){}
  return txt;
}

async function callHFModel(modelId, inputBody, isBlobInput){
  const headers = { "Authorization": "Bearer " + _TOK };
  if(!isBlobInput) headers["Content-Type"] = "application/json";
  const resp = await fetch("https://huggingface.co" + modelId, {
    method: "POST",
    headers: headers,
    body: isBlobInput ? inputBody : JSON.stringify(inputBody)
  });
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  const blob = await resp.blob();
  if(!blob || blob.size < 1000) throw new Error("Empty");
  return blob;
}

function renderVideoFromBlob(imgBlob){
  return new Promise(resolve => {
    const url = URL.createObjectURL(imgBlob);
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = 720; cv.height = 720;
      const ctx = cv.getContext("2d");
      const rec = new MediaRecorder(cv.captureStream(30), { mimeType: "video/webm" });
      const ch = [];
      rec.ondataavailable = e => { if(e.data.size) ch.push(e.data); };
      rec.onstop = () => resolve(URL.createObjectURL(new Blob(ch, { type: "video/webm" })));
      rec.start();
      let f = 0;
      function step(){
        f++;
        const s = 1 + (f / 110) * 0.18;
        ctx.clearRect(0, 0, 720, 720);
        ctx.save();
        ctx.translate(360 - f * 0.22, 360 - f * 0.15);
        ctx.scale(s, s);
        ctx.drawImage(img, -360, -360, 720, 720);
        ctx.restore();
        if(f < 110) requestAnimationFrame(step); else rec.stop();
      }
      step();
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function runAllTools(){
  const inp = document.getElementById("inp");
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value = "";

  const chat = document.getElementById("chat");
  const u = document.createElement("div"); u.className = "msg user"; u.textContent = txt; chat.appendChild(u);
  const a = document.createElement("div"); a.className = "msg ai";
  const st = document.createElement("div"); st.className = "step";
  st.textContent = "🔄 1/4: ترجمة وتحسين الوصف لمحركات Hugging Face...";
  a.appendChild(st); chat.appendChild(a); chat.scrollTop = chat.scrollHeight;

  const isVideo = /(فيديو|فلم|فيلم|تحريك|حرك|video|movie)/i.test(txt);
  const wantCutout = /(عزل|بدون خلفية|شفاف|cutout|rmbg)/i.test(txt);
  const clean = txt.replace(/^(صور|صورة|صوره|فيديو|فلم|فيلم|عزل|اعزل)\s*/i, "").trim() || txt;
  const eng = (await translateAr(clean)) + ", ultra realistic 8k photography, dramatic cinema lighting, masterpiece";

  let imgBlob = null;
  let usedModel = "";

  const generators = [
    "black-forest-labs/FLUX.1-schnell",
    "stabilityai/stable-diffusion-xl-base-1.0",
    "ByteDance/SDXL-Lightning"
  ];

  for(const m of generators){
    try{
      st.textContent = "⚡ 2/4: التوليد عبر " + m + "...";
      imgBlob = await callHFModel(m, { inputs: eng }, false);
      if(imgBlob){ usedModel = m; break; }
    }catch(e){}
  }

  if(imgBlob && wantCutout){
    try{
      st.textContent = "✂️ 3/4: عزل الخلفية عبر briaai/RMBG-2.0...";
      const cutBlob = await callHFModel("briaai/RMBG-2.0", imgBlob, true);
      if(cutBlob){ imgBlob = cutBlob; usedModel += " + RMBG-2.0"; }
    }catch(e){}
  }

  if(imgBlob){
    const box = document.createElement("div"); box.className = "media-box";
    if(isVideo){
      st.textContent = "🎬 4/4: تصيير الفيديو السينمائي المتحرك...";
      const vidUrl = await renderVideoFromBlob(imgBlob);
      if(vidUrl){
        st.textContent = "✅ اكتمل الدمج (" + usedModel + " + Video)!";
        const v = document.createElement("video");
        v.src = vidUrl; v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
        box.appendChild(v); a.appendChild(box);
        const dl = document.createElement("a");
        dl.href = vidUrl; dl.download = "DarkHorizon_Video_" + Date.now() + ".webm";
        dl.className = "act-btn"; dl.textContent = "⬇️ حفظ الفيديو النهائي";
        a.appendChild(dl); chat.scrollTop = chat.scrollHeight; return;
      }
    }
    const objUrl = URL.createObjectURL(imgBlob);
    st.textContent = "✅ اكتمل الإنتاج بنجاح عبر: " + usedModel;
    const im = document.createElement("img"); im.src = objUrl;
    box.appendChild(im); a.appendChild(box);
    const dl = document.createElement("a");
    dl.href = objUrl; dl.download = "DarkHorizon_8K_" + Date.now() + ".png";
    dl.className = "act-btn"; dl.textContent = "⬇️ حفظ الصورة النقية";
    a.appendChild(dl);
  } else {
    st.style.color = "#f87171";
    st.textContent = "⚠️ التوكن الحالي بصلاحية READ فقط؛ فعّل صلاحية Inference Providers في حسابك بـ Hugging Face ليعمل التوليد فوراً.";
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
