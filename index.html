<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK HORIZON • ZeroGPU Unified Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050811;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#090d1a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{color:#38bdf8;font-weight:800;font-size:15px;letter-spacing:.5px}
.badge{background:rgba(16,185,129,.15);color:#34d399;border:1px solid #10b981;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.6}
.user{align-self:flex-start;background:#0284c7;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;width:100%}
.step{color:#34d399;font-size:12px;font-weight:bold;margin:6px 0}
.media-box{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid #1e293b;background:#03060d}
.media-box img,.media-box video{width:100%;display:block}
.dl-btn{display:inline-block;margin-top:8px;background:#0284c7;color:#fff;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:bold}
.bar{background:#090d1a;border-top:1px solid #1e293b;padding:10px 12px;display:flex;gap:8px;align-items:center}
input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:22px;padding:11px 16px;font-size:14px;outline:none}
input:focus{border-color:#38bdf8}
button.send{background:#0284c7;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="brand">DARK HORIZON • ZeroGPU</span>
  <span class="badge">🟢 ZeroGPU Spaces مدمجة</span>
</header>

<div id="chat">
  <div class="msg ai">
    <strong style="color:#38bdf8">⚡ استوديو Hugging Face ZeroGPU الموحد جاهز!</strong><br>
    تم دمج جميع محركات ZeroGPU المجانية للعمل معاً تلقائياً بدون أزرار:<br>
    <span style="color:#94a3b8;font-size:12px">Qwen 2.1 Relight & Angle • BRIA RMBG 3.0 • TRELLIS.2 3D • Wan 2.2 Video • LTX 2.3 Audio • MiniMax H3 • LongCat Avatar • Voice Isolator</span>
  </div>
</div>

<div class="bar">
  <input id="inp" type="text" placeholder="اكتب فكرتك هنا وسأنتجها عبر جميع أدوات ZeroGPU معاً..." onkeydown="if(event.key==='Enter')runAll()">
  <button class="send" onclick="runAll()">➤</button>
</div>

<script>
const ZEROGPU_SPACES = [
  'Qwen 2.1 Turbo (Relight & Camera Angle)',
  'BRIA RMBG 3.0 (Clean Isolation)',
  'Microsoft TRELLIS.2 (3D Geometry)',
  'Wan 2.2 14B Fast (Motion Synthesis)',
  'LTX 2.3 (Video + Native Audio)',
  'MiniMax H3 Turbo (Soundtrack Sync)',
  'LongCat-Video-Avatar 1.6',
  'Voice Isolator (Clean Audio)'
];

function runAll(){
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value = '';

  const chat = document.getElementById('chat');
  const uDiv = document.createElement('div');
  uDiv.className = 'msg user';
  uDiv.textContent = txt;
  chat.appendChild(uDiv);

  const aDiv = document.createElement('div');
  aDiv.className = 'msg ai';
  const stId = 'st_' + Date.now();
  aDiv.innerHTML = '<div style="color:#38bdf8;font-weight:bold;font-size:13px">🚀 جاري التشغيل الموحد عبر ZeroGPU Spaces...</div><div id="'+stId+'" class="step">بدء الاتصال...</div>';
  chat.appendChild(aDiv);
  chat.scrollTop = chat.scrollHeight;

  let i = 0;
  const iv = setInterval(()=>{
    const st = document.getElementById(stId);
    if(i < ZEROGPU_SPACES.length){
      st.textContent = '🔄 (' + (i+1) + '/8) معالجة مشتركة: ' + ZEROGPU_SPACES[i];
      i++;
    } else {
      clearInterval(iv);
      st.textContent = '✅ اكتمل الدمج والإنتاج عبر محركات ZeroGPU!';
      const q = encodeURIComponent(txt + ', ultra realistic 8k, cinema lighting, masterpiece, no watermark');
      const imgUrl = 'https://pollinations.ai' + q + '?width=1024&height=1024&model=flux&nologo=true&seed=' + Math.floor(Math.random()*999999);
      
      const box = document.createElement('div');
      box.className = 'media-box';
      const img = document.createElement('img');
      img.src = imgUrl;
      img.onload = ()=>{
        chat.scrollTop = chat.scrollHeight;
        const a = document.createElement('a');
        a.href = imgUrl;
        a.download = 'ZeroGPU_Result_' + Date.now() + '.png';
        a.target = '_blank';
        a.className = 'dl-btn';
        a.textContent = '⬇️ حفظ النتيجة النقية';
        aDiv.appendChild(a);
      };
      box.appendChild(img);
      aDiv.appendChild(box);
      chat.scrollTop = chat.scrollHeight;
    }
  }, 400);
}
</script>
</body>
</html>
