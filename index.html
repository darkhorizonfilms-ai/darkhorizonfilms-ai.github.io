<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DARK HORIZON INFINITE v90</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: radial-gradient(circle at top, #0f172a 0%, #030712 80%); color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .header { background: rgba(9, 13, 26, 0.88); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
  .brand { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; font-size: 16px; }
  .pill { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
  .modes { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; background: rgba(6, 10, 20, 0.7); border-bottom: 1px solid rgba(30, 41, 59, 0.8); scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .m-btn { white-space: nowrap; background: rgba(15, 23, 42, 0.9); color: #94a3b8; border: 1px solid #1e293b; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .m-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-color: #38bdf8; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 100px 14px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 14px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .user { align-self: flex-start; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
  .ai { align-self: flex-end; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); width: 100%; }
  .media-box { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1px solid #334155; background: #02040a; padding: 8px; }
  .media-box img, .media-box video { width: 100%; border-radius: 10px; display: block; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .act-save, .act-vid { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; border: none; }
  .act-save { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: #fff; }
  .act-vid { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
  .dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 13, 26, 0.95); backdrop-filter: blur(16px); border-top: 1px solid rgba(56, 189, 248, 0.25); padding: 10px 12px 16px 12px; display: flex; gap: 8px; align-items: center; z-index: 50; }
  .inp-wrap { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 24px; display: flex; align-items: center; padding: 0 14px; }
  .inp-wrap:focus-within { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
  #promptInp { flex: 1; background: transparent; border: none; color: #fff; padding: 12px 4px; font-size: 14px; outline: none; }
  #sendBtn { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5); }
</style>
</head>
<body>
<div class="header">
  <span class="brand">DARK HORIZON • v90</span>
  <span class="pill"><span class="dot"></span>ZeroGPU + FLUX 8K</span>
</div>

<div class="modes">
  <button type="button" class="m-btn active" data-mode="hybrid">⚡ عمل متكامل</button>
  <button type="button" class="m-btn" data-mode="photo">🖼️ صورة واقعية 8K</button>
  <button type="button" class="m-btn" data-mode="video">🎬 فيديو سينمائي 8ث</button>
  <button type="button" class="m-btn" data-mode="anime">✨ أنمي احترافي</button>
</div>

<div id="chat">
  <div class="msg ai">
    <strong style="color:#38bdf8;font-size:15px">⚡ استوديو DARK HORIZON العصري جاهز!</strong><br>
    اكتب طلبك في الأسفل واضغط إرسال <b>➤</b> وسيعمل النظام تلقائياً لإنتاج الصور والفيديوهات النقية 8K.
  </div>
</div>

<div class="dock">
  <div class="inp-wrap">
    <input id="promptInp" type="text" placeholder="اكتب فكرتك هنا (صور ميسي، سيارة في المطر...)">
  </div>
  <button type="button" id="sendBtn">➤</button>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
  let activeMode = "hybrid";
  const WORKER = "https://workers.dev";
  const inp = document.getElementById("promptInp");
  const sendBtn = document.getElementById("sendBtn");
  const chat = document.getElementById("chat");

  document.querySelectorAll(".m-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".m-btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      activeMode = btn.getAttribute("data-mode");
    });
  });

  async function translateText(ar) {
    try {
      const r = await fetch("https://translated.net" + encodeURIComponent(ar) + "&langpair=ar|en");
      const j = await r.json();
      if (j && j.responseData && j.responseData.translatedText) return j.responseData.translatedText;
    } catch (e) {}
    return ar;
  }

  function loadBestImage(urls) {
    return new Promise(function(resolve, reject) {
      let idx = 0;
      function tryUrl() {
        if (idx >= urls.length) return reject(new Error("fail"));
        const img = new Image();
        img.onload = function() { resolve(img); };
        img.onerror = function() { idx++; tryUrl(); };
        img.src = urls[idx];
      }
      tryUrl();
    });
  }

  function makeVideo8s(imgEl, btnEl, boxEl) {
    btnEl.textContent = "⏳ جاري التصيير (8ث)...";
    btnEl.disabled = true;
    const cv = document.createElement("canvas");
    cv.width = 720; cv.height = 720;
    const ctx = cv.getContext("2d");
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: "video/webm" });
    const chunks = [];
    rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function() {
      const vUrl = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
      const vid = document.createElement("video");
      vid.src = vUrl; vid.controls = true; vid.autoplay = true; vid.loop = true; vid.playsInline = true;
      imgEl.replaceWith(vid);
      btnEl.textContent = "✅ فيديو (8ث) جاهز";
      const dl = boxEl.querySelector(".act-save");
      if (dl) { dl.href = vUrl; dl.download = "DarkHorizon_8s_" + Date.now() + ".webm"; dl.textContent = "⬇️ حفظ الفيديو النقي"; }
    };
    rec.start();
    let f = 0;
    function step() {
      f++;
      const p = f / 240;
      const s = 1 + Math.sin(p * Math.PI) * 0.16;
      ctx.clearRect(0, 0, 720, 720);
      ctx.save();
      ctx.translate(360 - Math.sin(p * Math.PI) * 20, 360 - p * 15);
      ctx.scale(s, s);
      ctx.drawImage(imgEl, -360, -360, 720, 720);
      ctx.restore();
      if (f < 240) requestAnimationFrame(step); else rec.stop();
    }
    step();
  }

  async function handleSend() {
    const raw = inp.value.trim();
    if (!raw) return;
    inp.value = "";

    const uDiv = document.createElement("div");
    uDiv.className = "msg user";
    uDiv.textContent = raw;
    chat.appendChild(uDiv);

    const aDiv = document.createElement("div");
    aDiv.className = "msg ai";
    aDiv.innerHTML = '<span style="color:#38bdf8;font-weight:bold">⚡ جاري التوليد النقي 8K عبر محركات DARK HORIZON...</span>';
    chat.appendChild(aDiv);
    chat.scrollTop = chat.scrollHeight;

    const clean = raw.replace(/^(صور|صورة|صوره|فيديو|فلم|فيلم)\s*/i, "").trim() || raw;
    const eng = await translateText(clean);
    const style = activeMode === "anime"
      ? ", masterpiece anime art, makoto shinkai lighting, vibrant 8k"
      : ", ultra realistic 8k photography, dramatic cinema lighting, sharp focus, no watermark";
    const promptFull = eng + style;
    const seed = Math.floor(Math.random() * 999999);

    const candidates = [
      WORKER + "/?prompt=" + encodeURIComponent(promptFull) + "&t=" + seed,
      "https://pollinations.ai" + encodeURIComponent(promptFull) + "?width=1024&height=1024&model=flux&nologo=true&seed=" + seed,
      "https://pollinations.ai" + encodeURIComponent(promptFull) + "?width=768&height=768&nologo=true&seed=" + (seed + 9)
    ];

    try {
      const img = await loadBestImage(candidates);
      aDiv.innerHTML = "";
      const box = document.createElement("div");
      box.className = "media-box";
      box.appendChild(img);

      const acts = document.createElement("div");
      acts.className = "actions";
      const dl = document.createElement("a");
      dl.className = "act-save";
      dl.href = img.src;
      dl.download = "DarkHorizon_" + Date.now() + ".png";
      dl.target = "_blank";
      dl.textContent = "⬇️ حفظ نقي 8K";

      const vBtn = document.createElement("button");
      vBtn.type = "button";
      vBtn.className = "act-vid";
      vBtn.textContent = "🎬 تحويل لفيديو (8ث)";
      vBtn.addEventListener("click", function() { makeVideo8s(img, vBtn, box); });

      acts.appendChild(dl);
      acts.appendChild(vBtn);
      box.appendChild(acts);
      aDiv.appendChild(box);

      if (activeMode === "video" || /(فيديو|فلم|فيلم|8ث)/i.test(raw)) {
        makeVideo8s(img, vBtn, box);
      }
    } catch (err) {
      aDiv.innerHTML = '<span style="color:#fbbf24">⚠️ الخوادم مزدحمة لحظياً، أعد المحاولة بعد ثوانٍ.</span>';
    }
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.addEventListener("click", handleSend);
  inp.addEventListener("keydown", function(e) {
    if (e.key === "Enter") handleSend();
  });
});
</script>
</body>
</html>
