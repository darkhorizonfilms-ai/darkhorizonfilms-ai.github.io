<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DARK HORIZON INFINITE v89</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 0%,#111d38 0%,#040711 75%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:rgba(9,13,26,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(56,189,248,0.2);padding:12px 14px;display:flex;flex-direction:column;gap:10px;z-index:20}
.title-row{display:flex;justify-content:space-between;align-items:center}
.brand{background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:16px;letter-spacing:.5px}
.status-pill{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.4);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:0 0 12px rgba(16,185,129,.15)}
.dot{width:7px;height:7px;background:#10b981;border-radius:50%;box-shadow:0 0 8px #10b981}
.ctrl-row{display:flex;gap:8px}
.mini-btn{background:rgba(15,23,42,0.9);color:#e2e8f0;border:1px solid rgba(56,189,248,0.25);padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.mini-btn:active{transform:scale(0.95);background:#1e293b}
.modes{display:flex;overflow-x:auto;gap:8px;padding:10px 12px;background:rgba(6,10,20,0.7);border-bottom:1px solid rgba(30,41,59,0.7);scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode-btn{white-space:nowrap;background:rgba(15,23,42,0.85);color:#94a3b8;border:1px solid #1e293b;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.mode-btn.active{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border-color:#38bdf8;box-shadow:0 4px 14px rgba(2,132,199,0.45)}
#chat{flex:1;overflow-y:auto;padding:16px 14px 100px 14px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;padding:14px 16px;border-radius:18px;font-size:14px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
.user{align-self:flex-start;background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-end;background:rgba(15,23,42,0.8);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,0.2);width:100%}
.media-card{margin-top:8px;border-radius:14px;overflow:hidden;border:1px solid rgba(56,189,248,0.25);background:#03060d;padding:8px}
.media-card img,.media-card video{width:100%;border-radius:10px;display:block}
.card-actions{display:flex;gap:8px;margin-top:8px}
.btn-save,.btn-vid{flex:1;text-align:center;padding:9px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:700;cursor:pointer;border:none}
.btn-save{background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff}
.btn-vid{background:#1e293b;color:#38bdf8;border:1px solid #38bdf8}
.dock{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,26,0.92);backdrop-filter:blur(16px);border-top:1px solid rgba(56,189,248,0.25);padding:10px 12px 16px 12px;display:flex;gap:8px;align-items:center;z-index:50}
.inp-box{flex:1;background:#0f172a;border:1px solid #334155;border-radius:24px;display:flex;align-items:center;padding:0 12px;transition:.2s}
.inp-box:focus-within{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,0.25)}
input{flex:1;background:transparent;border:none;color:#fff;padding:11px 6px;font-size:14px;outline:none}
.icon-btn{background:none;border:none;color:#94a3b8;font-size:17px;padding:6px;cursor:pointer}
.send-btn{background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,0.5)}
#settingsModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#0f172a;border:1px solid #38bdf8;border-radius:18px;padding:18px;width:100%;max-width:400px}
.modal-box input{width:100%;background:#050811;border:1px solid #334155;border-radius:10px;padding:11px;margin:12px 0;color:#34d399;direction:ltr}
</style></head>
<body>
<div class="top-bar">
  <div class="title-row"><span class="brand">DARK HORIZON INFINITE v89</span><span class="status-pill"><span class="dot"></span>GPT + Gemini + FLUX + ICBINP 24/7</span></div>
  <div class="ctrl-row"><button type="button" onclick="showSet()" class="mini-btn">⚙️ الإعدادات</button><button type="button" onclick="resetChat()" class="mini-btn">+ جديد</button></div>
</div>
<div class="modes">
  <button type="button" onclick="pickMode(this)" class="mode-btn active" data-mode="hybrid">🔴 عمل متكامل (ذكاء + إنتاج)</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="photo">🖼️ صورة واقعية 8K</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="video">🎬 فيديو سينمائي 8ث</button>
  <button type="button" onclick="pickMode(this)" class="mode-btn" data-mode="anime">✨ أنمي احترافي</button>
</div>
<div id="chat"><div class="msg ai"><strong style="color:#38bdf8">⚡ استوديو DARK HORIZON INFINITE v89 جاهز!</strong><br>اكتب فكرتك في الأسفل وسيتم التوليد النقي 8K بدون علامات مائية.</div></div>
<div class="dock">
  <div class="inp-box"><button type="button" onclick="addMagic()" class="icon-btn">✨</button><input id="inp" type="text" placeholder="اكتب فكرتك أو فيلماً بالكامل..." onkeydown="if(event.key==='Enter')goSend()"><button type="button" onclick="runMic()" class="icon-btn">🎤</button></div>
  <button type="button" onclick="goSend()" class="send-btn">➤</button>
</div>
<div id="settingsModal"><div class="modal-box"><strong style="color:#38bdf8">⚙️ إعدادات الخادم (Cloudflare Worker)</strong><input id="workerInp" type="text" value="https://workers.dev"><div style="display:flex;gap:8px"><button type="button" onclick="saveSet()" class="btn-save">حفظ</button><button type="button" onclick="closeSet()" class="btn-vid">إغلاق</button></div></div></div>
<script>
var activeMode = "hybrid";
var DEFAULT_W = "https://workers.dev";

function pickMode(el) {
  var all = document.querySelectorAll(".mode-btn");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  el.classList.add("active");
  activeMode = el.getAttribute("data-mode") || "hybrid";
}

function resetChat() {
  document.getElementById("chat").innerHTML = '<div class="msg ai"><strong style="color:#38bdf8">⚡ جلسة إنتاج جديدة جاهزة!</strong></div>';
}

function showSet() {
  document.getElementById("workerInp").value = localStorage.getItem("DH_WORKER") || DEFAULT_W;
  document.getElementById("settingsModal").style.display = "flex";
}

function saveSet() {
  localStorage.setItem("DH_WORKER", document.getElementById("workerInp").value.trim() || DEFAULT_W);
  document.getElementById("settingsModal").style.display = "none";
}

function closeSet() {
  document.getElementById("settingsModal").style.display = "none";
}

function addMagic() {
  var inp = document.getElementById("inp");
  if (inp.value.trim()) inp.value += " ، إضاءة سينمائية 8K فائق الواقعية";
}

function runMic() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("المتصفح لا يدعم الصوت"); return; }
  var r = new SR(); r.lang = "ar-SA";
  r.onresult = function(e) { document.getElementById("inp").value = e.results.transcript; };
  r.start();
}

function makeVid(im, btn, card) {
  btn.textContent = "⏳ جاري التصيير (8ث)...";
  btn.disabled = true;
  var cv = document.createElement("canvas"); cv.width = 720; cv.height = 720;
  var ctx = cv.getContext("2d");
  var rec = new MediaRecorder(cv.captureStream(30), { mimeType: "video/webm" });
  var ch = [];
  rec.ondataavailable = function(e) { if (e.data.size > 0) ch.push(e.data); };
  rec.onstop = function() {
    var vUrl = URL.createObjectURL(new Blob(ch, { type: "video/webm" }));
    var vid = document.createElement("video");
    vid.src = vUrl; vid.controls = true; vid.autoplay = true; vid.loop = true; vid.playsInline = true;
    im.replaceWith(vid);
    btn.textContent = "✅ فيديو (8ث) جاهز";
    var sl = card.querySelector(".btn-save");
    if (sl) { sl.href = vUrl; sl.download = "DarkHorizon_8s_" + Date.now() + ".webm"; sl.textContent = "⬇️ حفظ الفيديو النقي"; }
  };
  rec.start();
  var f = 0;
  function step() {
    f++; var p = f / 240, s = 1 + Math.sin(p * Math.PI) * 0.16;
    ctx.clearRect(0, 0, 720, 720); ctx.save();
    ctx.translate(360 - Math.sin(p * Math.PI) * 20, 360 - p * 15); ctx.scale(s, s);
    ctx.drawImage(im, -360, -360, 720, 720); ctx.restore();
    if (f < 240) requestAnimationFrame(step); else rec.stop();
  }
  step();
}

function goSend() {
  var inp = document.getElementById("inp"), txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  var chat = document.getElementById("chat");
  var u = document.createElement("div"); u.className = "msg user"; u.textContent = txt; chat.appendChild(u);
  var a = document.createElement("div"); a.className = "msg ai";
  a.innerHTML = '<span style="color:#38bdf8;font-size:13px">⚡ جاري التوليد النقي 8K...</span>';
  chat.appendChild(a); chat.scrollTop = chat.scrollHeight;

  var clean = txt.replace("صور ", "").replace("صورة ", "").replace("صوره ", "").replace("فيديو ", "").trim();
  if (!clean || clean === "صور" || clean === "صورة") clean = "futuristic cyber warrior in rain";

  fetch("https://translated.net" + encodeURIComponent(clean) + "&langpair=ar|en")
    .then(function(r) { return r.json(); })
    .then(function(j) {
      var en = (j && j.responseData && j.responseData.translatedText) ? j.responseData.translatedText : clean;
      loadImg(en, txt, a, chat);
    })
    .catch(function() { loadImg(clean, txt, a, chat); });
}

function loadImg(eng, rawTxt, a, chat) {
  var suf = activeMode === "anime" ? ", masterpiece anime style, 8k" : ", ultra realistic 8k photography, dramatic cinema lighting, no watermark";
  var full = eng + suf;
  var w = (localStorage.getItem("DH_WORKER") || DEFAULT_W).trim();
  if (w.charAt(w.length - 1) === "/") w = w.slice(0, -1);
  var seed = Math.floor(Math.random() * 999999);
  var u1 = w + "/?prompt=" + encodeURIComponent(full) + "&t=" + seed;
  var u2 = "https://pollinations.ai" + encodeURIComponent(full) + "?width=1024&height=1024&model=flux&nologo=true&seed=" + seed;

  var im = new Image();
  im.onload = function() {
    a.innerHTML = "";
    var card = document.createElement("div"); card.className = "media-card"; card.appendChild(im);
    var acts = document.createElement("div"); acts.className = "card-actions";
    var dl = document.createElement("a"); dl.className = "btn-save"; dl.href = im.src; dl.download = "DarkHorizon_" + Date.now() + ".png"; dl.target = "_blank"; dl.textContent = "⬇️ حفظ نقي 8K";
    var vb = document.createElement("button"); vb.type = "button"; vb.className = "btn-vid"; vb.textContent = "🎬 تحويل لفيديو (8ث)";
    vb.onclick = function() { makeVid(im, vb, card); };
    acts.appendChild(dl); acts.appendChild(vb); card.appendChild(acts); a.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
    if (activeMode === "video" || rawTxt.indexOf("فيديو") !== -1) makeVid(im, vb, card);
  };
  im.onerror = function() {
    if (im.src !== u2) im.src = u2;
    else a.innerHTML = '<span style="color:#fbbf24">⚠️ الخوادم مزدحمة لحظياً، أعد المحاولة بعد ثوانٍ.</span>';
  };
  im.src = u1;
}
</script></body></html>
