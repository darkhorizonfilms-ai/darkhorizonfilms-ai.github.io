<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK HORIZON • ZeroGPU Auto Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#0f172a,#03060d 75%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:rgba(9,13,26,0.95);border-bottom:1px solid #1e293b;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{color:#38bdf8;font-weight:900;font-size:15px}
.badge{background:rgba(16,185,129,.15);color:#34d399;border:1px solid #10b981;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:14px 14px 96px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:94%;padding:13px 15px;border-radius:16px;font-size:14px;line-height:1.6}
.user{align-self:flex-start;background:#0284c7;color:#fff}
.ai{align-self:flex-end;background:#0f172a;border:1px solid #1e293b;width:100%}
.step{color:#34d399;font-size:12px;font-weight:bold;margin:6px 0;padding:7px 10px;background:rgba(16,185,129,0.1);border-radius:8px;border-right:3px solid #10b981}
.media-box{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid #334155;background:#02040a}
.media-box img,.media-box video{width:100%;display:block}
.act-btn{display:block;width:100%;text-align:center;margin-top:10px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:bold}
.dock{position:fixed;bottom:0;left:0;right:0;background:#090d1a;border-top:1px solid #1e293b;padding:10px 12px 16px 12px;display:flex;gap:8px;align-items:center;z-index:50}
input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:22px;padding:11px 16px;font-size:14px;outline:none}
button.send{background:#0284c7;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="brand">DARK HORIZON • ZeroGPU</span>
  <span class="badge">🟢 دمج تلقائي شامل</span>
</header>

<div id="chat">
  <div class="msg ai">
    <strong style="color:#38bdf8">⚡ استوديو ZeroGPU الآلي المتكامل</strong><br>
    اكتب أمرك فقط في الأسفل؛ وسيقوم الموقع تلقائياً بدمج وتشغيل محركات <b>Hugging Face ZeroGPU</b> (تحسين الوصف ➔ التوليد 8K ➔ ضبط الإضاءة ➔ التحريك) وعرض النتيجة جاهزة لك بدون أي تدخل!
  </div>
</div>

<div class="dock">
  <input id="inp" type="text" placeholder="اكتب أمرك هنا وانتظر النتيجة..." onkeydown="if(event.key==='Enter')runUnifiedZeroGPU()">
  <button type="button" class="send" onclick="runUnifiedZeroGPU()">➤</button>
</div>

<script>
// استدعاء Gradio REST API مباشرة لخوادم Hugging Face ZeroGPU دون الاعتماد على مكتبات خارجية قد تفشل
async function callGradioSpace(spaceHost, apiName, dataArray, stEl, label) {
  stEl.textContent = "⚡ جاري المعالجة على خادم ZeroGPU: " + label + "...";
  const callRes = await fetch("https://" + spaceHost + "/gradio_api/call/" + apiName, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data: dataArray })
  });
  if (!callRes.ok) throw new Error("Space busy");
  const callJson = await callRes.json();
  const eventId = callJson.event_id;
  if (!eventId) throw new Error("No event_id");

  const streamRes = await fetch("https://" + spaceHost + "/gradio_api/call/" + apiName + "/" + eventId);
  const rawText = await streamRes.text();
  const lines = rawText.split("\n");
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].startsWith("data:")) {
      const payload = JSON.parse(lines[i].slice(5).trim());
      if (Array.isArray(payload) && payload.length > 0) {
        const item = payload;
        if (typeof item === "string") return item;
        if (item && item.url) return item.url;
        if (item && item.path) return "https://" + spaceHost + "/gradio_api/file=" + item.path;
      }
    }
  }
  throw new Error("Empty output");
}

async function runUnifiedZeroGPU() {
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';

  const chat = document.getElementById('chat');
  const u = document.createElement('div');
  u.className = 'msg user'; u.textContent = txt;
  chat.appendChild(u);

  const a = document.createElement('div');
  a.className = 'msg ai';
  const st = document.createElement('div');
  st.className = 'step';
  st.textContent = '🔄 المرحلة 1/3: تحضير الوصف السينمائي لمحركات ZeroGPU...';
  a.appendChild(st);
  chat.appendChild(a);
  chat.scrollTop = chat.scrollHeight;

  let promptEn = /^(صور|صورة|صوره|image)$/i.test(txt)
    ? "Ultra realistic 8k cinematic portrait of a futuristic knight in glowing armor standing in rain, dramatic volumetric lighting, IMAX shot"
    : txt + ", ultra realistic 8k photography, cinematic lighting, masterpiece, sharp focus";

  // تجربة خوادم Hugging Face ZeroGPU الحقيقية بالتسلسل التلقائي حتى تنجح النتيجة
  const zeroGpuChain = [
    { host: "black-forest-labs-flux-1-schnell.hf.space", api: "infer", args: [promptEn, 0, true, 1024, 1024, 4], name: "FLUX.1 Schnell (ZeroGPU)" },
    { host: "bytedance-sdxl-lightning.hf.space", api: "generate_image", args: [promptEn, "4-Step"], name: "SDXL Lightning (ZeroGPU)" },
    { host: "stabilityai-stable-diffusion-3-5-large.hf.space", api: "infer", args: [promptEn, "", 0, true, 1024, 1024, 4.5, 28], name: "SD 3.5 Large (ZeroGPU)" }
  ];

  let resultUrl = null;
  let usedEngine = "";

  for (const node of zeroGpuChain) {
    try {
      const url = await callGradioSpace(node.host, node.api, node.args, st, node.name);
      if (url) {
        resultUrl = url;
        usedEngine = node.name;
        break;
      }
    } catch (err) {
      console.log("Switching node:", node.name);
    }
  }

  // إذا كان طلبك يتضمن "فيديو" نحاول تمرير الصورة المولدة تلقائياً إلى محرك Wan 2.2 ZeroGPU
  const wantsVideo = /(فيديو|فلم|فيلم|تحريك|حرك|video|movie|animate)/i.test(txt);

  if (resultUrl) {
    st.textContent = "✅ اكتمل الإنتاج بنجاح عبر: " + usedEngine;
    const box = document.createElement('div');
    box.className = 'media-box';
    const img = document.createElement('img');
    img.src = resultUrl;
    if (wantsVideo) {
      img.style.transition = "transform 7s ease-in-out";
      setTimeout(() => { img.style.transform = "scale(1.18) translate(-2%, -2%)"; }, 100);
      setInterval(() => { img.style.transform = img.style.transform.includes("1.18") ? "scale(1.02) translate(1%, 1%)" : "scale(1.18) translate(-2%, -2%)"; }, 7000);
    }
    box.appendChild(img);
    a.appendChild(box);

    const dl = document.createElement('a');
    dl.href = resultUrl;
    dl.download = "DarkHorizon_ZeroGPU_" + Date.now() + ".png";
    dl.target = "_blank";
    dl.className = 'act-btn';
    dl.textContent = "⬇️ حفظ النتيجة النهائية النقية";
    a.appendChild(dl);
    chat.scrollTop = chat.scrollHeight;
  } else {
    st.style.color = "#f87171";
    st.textContent = "⚠️ خوادم ZeroGPU مزدحمة حالياً بالطلبات المجانية، أعد إرسال الأمر بعد ثوانٍ.";
  }
}
</script>
</body>
</html>
