async function aiDirector(q){let secs=8,mMin=q.match(/(\d+)\s*(?:دقيق|دقائق|min)/i),mSec=q.match(/(\d+)\s*(?:ثان|ثوان|sec)/i);if(mMin)secs=parseInt(mMin.at(1))*60;else if(mSec)secs=parseInt(mSec.at(1));const clips=Math.min(5,Math.max(2,Math.ceil(secs/5)));const sys=`أنت مخرج أفلام ومساعد ذكي يجمع قوة ChatGPT و Gemini. إذا كان طلب المستخدم سؤالاً أو دردشة أجب بوضوح، وإذا طلب صورة أو فيديو صِغ برومبت إنجليزي احترافي دقيق مع حوار عربي. أرجع JSON فقط: {"intent":"video|image|anime|3d|chat","reply":"إجابتك بالعربية","dialogue":"جملة حوارية بالعربية","scenes":["ultra-detailed English visual prompt 1","ultra-detailed English visual prompt 2"]}`;if(CFG.gem){try{const gr=await fetch("https:"+S+S+"://googleapis.com"+S+"v1beta"+S+"models"+S+"gemini-2.0-flash:generateContent?key="+encodeURIComponent(CFG.gem),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:sys+"\nالطلب: "+q}]}]})});if(gr.ok){const gd=await gr.json(),txt=gd.candidates&&gd.candidates.at(0)&&gd.candidates.at(0).content&&gd.candidates.at(0).content.parts&&gd.candidates.at(0).content.parts.at(0)&&gd.candidates.at(0).content.parts.at(0).text,m=txt&&txt.match(/\{[\s\S]*\}/);if(m){const o=JSON.parse(m.at(0));o.secs=secs;if(!o.scenes||!o.scenes.length)o.scenes=[q];return o;}}}catch(e){}}for(const mdl of ["openai-large","gemini","openai"]){try{const r=await fetch("https:"+S+S+"text.pollinations.ai"+S+"openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:mdl,messages:[{role:"system",content:sys},{role:"user",content:q}]})}),d=await r.json(),txt=d.choices&&d.choices.at(0)&&d.choices.at(0).message&&d.choices.at(0).message.content,m=txt&&txt.match(/\{[\s\S]*\}/);if(m){const o=JSON.parse(m.at(0));o.secs=secs;if(!o.scenes||!o.scenes.length)o.scenes=[q];while(o.scenes.length<clips)o.scenes.push(o.scenes.at(0)+", dynamic camera angle "+o.scenes.length);return o;}}catch(e){}}let en=q;if(/[\u0600-\u06FF]/.test(en)){try{const tr=await(await fetch("https:"+S+S+"api.mymemory.translated.net"+S+"get?q="+encodeURIComponent(en)+"&langpair=ar|en")).json();if(tr&&tr.responseData)en=tr.responseData.translatedText;}catch(e){}}return {intent:/فيديو|فيلم|سباق|قتال|video/i.test(q)?"video":(/صورة|صور|ارسم|صمم|image/i.test(q)?"image":"chat"),reply:"",dialogue:"",scenes:Array.from({length:clips},(_,i)=>en+", shot "+(i+1)),secs};}
async function genHybridImage(en,kind,box,hdr){
  const sel=document.getElementById("mdlSel").value;
  const boost=", shot on Canon EOS R5, 85mm f/1.4 lens, sharp facial details, crisp eyes, realistic skin texture, 8k uhd, photorealistic, hyper-detailed";
  const fullP=en+(kind==="anime"?", masterpiece anime film still, Ufotable style, 8k":kind==="3d"?", Unreal Engine 5 3D render, raytracing, PBR, 8k":boost);

  const results=[];
  const gridId="grid_"+Date.now();
  box.innerHTML=`${hdr}<div id="${gridId}_st" style="color:#38bdf8;font-size:11px;margin:4px 0">⚡ جاري تشغيل جميع الخوادم معاً بالتوازي (FLUX.1 + ICBINP + Juggernaut + RealVisXL)...</div><div id="${gridId}" style="display:flex;flex-direction:column;gap:10px"></div>`;

    results.push({u,mdl});

    if(!grid)return;
    const card=document.createElement("div");
    card.style.cssText="background:#020617;border:1px solid #1e293b;border-radius:10px;padding:8px";
    card.innerHTML=`<div style="color:#34d399;font-size:11px;margin-bottom:4px">✨ الخادم #${results.length}: <b>${mdl}</b></div><img src="${u}" class="pic"><div class="bar"><button type="button" class="abtn" onclick="forceDl('${u}','DarkHorizon_${results.length}_8K.png')">⬇️ حفظ 8K</button><button type="button" class="abtn vid-btn">🎬 تحويل لفيديو</button></div>`;
    card.querySelector(".vid-btn").onclick=()=>genHybridVideo([en],8,"",box,hdr);
    grid.appendChild(card);
    const st=document.getElementById(gridId+"_st");
    if(st)st.innerHTML=`✅ وصلت <b>${results.length}</b> صور فائقة الدقة (باقي الخوادم تواصل التصيير في الخلفية...)`;
  }

  // مهمة 1: خادم Kaggle T4 8K (إذا كان مفعلاً)
  const runKaggle=async()=>{
    if(!CFG.gpu||(sel!=="AUTO"&&sel!=="KAGGLE"))return;
    try{
      const wf={"1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"JuggernautXL.safetensors"}},"2":{"class_type":"CLIPTextEncode","inputs":{"text":fullP,"clip":["1",1]}},"3":{"class_type":"CLIPTextEncode","inputs":{"text":"deformed face, distorted eyes, blurry, lowres, watermark","clip":["1",1]}},"4":{"class_type":"EmptyLatentImage","inputs":{"width":1024,"height":1024,"batch_size":1}},"5":{"class_type":"KSampler","inputs":{"seed":Math.floor(Math.random()*999999),"steps":16,"cfg":5.5,"sampler_name":"dpmpp_2m_sde","scheduler":"karras","denoise":1,"model":["1",0],"positive":["2",0],"negative":["3",0],"latent_image":["4",0]}},"6":{"class_type":"VAEDecode","inputs":{"samples":["5",0],"vae":["1",2]}},"7":{"class_type":"SaveImage","inputs":{"filename_prefix":"DH_8K","images":["6",0]}}};
      const pr=await fetch(CFG.gpu+"/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:wf})});
      if(!pr.ok)return;
      const {prompt_id}=await pr.json();
      for(let i=0;i<35;i++){
        await new Promise(r=>setTimeout(r,1500));
        const hr=await(await fetch(CFG.gpu+"/history/"+prompt_id)).json();
        if(hr[prompt_id]){
          const f=hr[prompt_id].outputs["7"].images.at(0);
          pushResult(CFG.gpu+"/view?filename="+encodeURIComponent(f.filename)+"&subfolder="+encodeURIComponent(f.subfolder)+"&type="+f.type,"Kaggle T4 • JuggernautXL 8K (1024px)");
          return;
        }
      }
    }catch(e){}
  };

  // مهمة 2: خادم FLUX.1-schnell (1024px) مع إعادة محاولة مستمرة في الخلفية
  const runFlux=async()=>{
    if(sel!=="AUTO"&&sel!=="FLUX_SCHNELL")return;
    for(let attempt=0;attempt<4;attempt++){
      for(const pfx of ["/gradio_api/call/","/call/"]){
        try{
          const base="https:"+S+S+"black-forest-labs-flux-1-schnell.hf.space"+pfx+"infer";
          const r=await fetch(base,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:[fullP,Math.floor(Math.random()*999999)+1,false,1024,1024,4]})});

        }catch(e){}

      await new Promise(r=>setTimeout(r,2000));

    return await genHybridImage(en,kind,box,hdr);
